/* ---------- SPRITE GENERATION WITH AUTO OUTLINE ---------- */
function buildSprite(mask, fillCol, outCol) {
  const mh = mask.length, mw = mask[0].length;
  const sw = mw + 2, sh = mh + 2;
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const g = c.getContext('2d');

  // compute outline (dilated mask minus mask)
  const outline = [];
  for (let r = 0; r < sh; r++) outline.push(new Array(sw).fill(false));
  for (let r = 0; r < mh; r++) {
    for (let cc = 0; cc < mw; cc++) {
      if (mask[r][cc] !== 'X') continue;
      const rr = r + 1, cx = cc + 1;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = rr + dr, nc = cx + dc;
          if (nr >= 0 && nr < sh && nc >= 0 && nc < sw) outline[nr][nc] = true;
        }
      }
    }
  }
  g.fillStyle = outCol;
  for (let r = 0; r < sh; r++) {
    for (let cc = 0; cc < sw; cc++) {
      if (outline[r][cc]) g.fillRect(cc, r, 1, 1);
    }
  }
  // fill on top
  g.fillStyle = fillCol;
  for (let r = 0; r < mh; r++) {
    for (let cc = 0; cc < mw; cc++) {
      if (mask[r][cc] === 'X') g.fillRect(cc + 1, r + 1, 1, 1);
    }
  }
  return c;
}

const PIECE_SPRITES = {

/* =========================================================
   CHESS LOGIC
   ========================================================= */
function inB(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

function initialBoard() {
  const back = ['r','n','b','q','k','b','n','r'];
  const board = [];
  for (let r = 0; r < 8; r++) board.push(new Array(8).fill(null));
  for (let c = 0; c < 8; c++) {
    board[0][c] = { type: back[c], color: 'b' };
    board[1][c] = { type: 'p', color: 'b' };
    board[6][c] = { type: 'p', color: 'w' };
    board[7][c] = { type: back[c], color: 'w' };
  }
  return board;
}

function initialState() {
  return {
    board: initialBoard(),
    turn: 'w',
    castling: { wK: true, wQ: true, bK: true, bQ: true },
    ep: null,
    halfmove: 0,
    fullmove: 1
  };
}

function cloneState(s) {
  const board = [];
  for (let r = 0; r < 8; r++) {
    board.push(new Array(8));
    for (let c = 0; c < 8; c++) {
      const p = s.board[r][c];
      board[r][c] = p ? { type: p.type, color: p.color } : null;
    }
  }
  return {
    board: board,
    turn: s.turn,
    castling: { wK: s.castling.wK, wQ: s.castling.wQ, bK: s.castling.bK, bQ: s.castling.bQ },
    ep: s.ep ? { r: s.ep.r, c: s.ep.c } : null,
    halfmove: s.halfmove,
    fullmove: s.fullmove
  };
}

function attacked(state, r, c, byColor) {
  const b = state.board;
  // pawn
  const pr = r + (byColor === 'w' ? 1 : -1);
  for (const dc of [-1, 1]) {
    const pc = c + dc;
    if (inB(pr, pc)) {
      const p = b[pr][pc];
      if (p && p.color === byColor && p.type === 'p') return true;
    }
  }
  // knight
  const noff = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  for (const o of noff) {
    const nr = r + o[0], nc = c + o[1];
    if (inB(nr, nc)) {
      const p = b[nr][nc];
      if (p && p.color === byColor && p.type === 'n') return true;
    }
  }
  // king
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (inB(nr, nc)) {
        const p = b[nr][nc];
        if (p && p.color === byColor && p.type === 'k') return true;
      }
    }
  }
  // rook/queen straight
  const rdirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const d of rdirs) {
    let nr = r + d[0], nc = c + d[1];
    while (inB(nr, nc)) {
      const p = b[nr][nc];
      if (p) {
        if (p.color === byColor && (p.type === 'r' || p.type === 'q')) return true;
        break;
      }
      nr += d[0]; nc += d[1];
    }
  }
  // bishop/queen diagonal
  const bdirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
  for (const d of bdirs) {
    let nr = r + d[0], nc = c + d[1];
    while (inB(nr, nc)) {
      const p = b[nr][nc];
      if (p) {
        if (p.color === byColor && (p.type === 'b' || p.type === 'q')) return true;
        break;
      }
      nr += d[0]; nc += d[1];
    }
  }
  return false;
}

function kingPos(state, color) {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = state.board[r][c];
      if (p && p.type === 'k' && p.color === color) return [r, c];
    }
  }
  return null;
}

function kingInCheck(state, color) {
  const kp = kingPos(state, color);
  if (!kp) return false;
  return attacked(state, kp[0], kp[1], color === 'w' ? 'b' : 'w');
}

function genPawnMoves(moves, state, r, c, color) {
  const b = state.board;
  const dir = color === 'w' ? -1 : 1;
  const startRank = color === 'w' ? 6 : 1;
  const promoRank = color === 'w' ? 0 : 7;

  // forward
  if (inB(r + dir, c) && !b[r + dir][c]) {
    pushPawn(moves, r, c, r + dir, c, promoRank);
    if (r === startRank && !b[r + 2*dir][c]) {
      moves.push({ from: [r, c], to: [r + 2*dir, c], piece: 'p', double: true });
    }
  }
  // captures
  for (const dc of [-1, 1]) {
    const nr = r + dir, nc = c + dc;
    if (!inB(nr, nc)) continue;
    const t = b[nr][nc];
    if (t && t.color !== color) {
      pushPawn(moves, r, c, nr, nc, promoRank);
    }
    // en passant
    if (state.ep && state.ep.r === nr && state.ep.c === nc && !t) {
      moves.push({ from: [r, c], to: [nr, nc], piece: 'p', ep: true });
    }
  }
}

function pushPawn(moves, fr, fc, tr, tc, promoRank) {
  if (tr === promoRank) {
    for (const p of ['q', 'r', 'b', 'n']) {
      moves.push({ from: [fr, fc], to: [tr, tc], piece: 'p', promotion: p });
    }
  } else {
    moves.push({ from: [fr, fc], to: [tr, tc], piece: 'p' });
  }
}

function generateMoves(state, color) {
  const moves = [];
  const b = state.board;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = b[r][c];
      if (!p || p.color !== color) continue;
      const t = p.type;
      if (t === 'p') {
        genPawnMoves(moves, state, r, c, color);
      } else if (t === 'n') {
        const offs = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const o of offs) {
          const nr = r + o[0], nc = c + o[1];
          if (!inB(nr, nc)) continue;
          const tg = b[nr][nc];
          if (!tg || tg.color !== color) moves.push({ from: [r, c], to: [nr, nc], piece: 'n' });
        }
      } else if (t === 'b' || t === 'r' || t === 'q') {
        const dirs = [];
        if (t === 'b' || t === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        if (t === 'r' || t === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
        for (const d of dirs) {
          let nr = r + d[0], nc = c + d[1];
          while (inB(nr, nc)) {
            const tg = b[nr][nc];
            if (tg && tg.color === color) break;
            moves.push({ from: [r, c], to: [nr, nc], piece: t });
            if (tg) break;
            nr += d[0]; nc += d[1];
          }
        }
      } else if (t === 'k') {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (!inB(nr, nc)) continue;
            const tg = b[nr][nc];
            if (!tg || tg.color !== color) {
              moves.push({ from: [r, c], to: [nr, nc], piece: 'k' });
            }
          }
        }
        // castling
        const enemy = color === 'w' ? 'b' : 'w';
        if (color === 'w' && r === 7 && c === 4) {
          if (state.castling.wK && !b[7][5] && !b[7][6] &&
              !attacked(state, 7, 4, enemy) && !attacked(state, 7, 5, enemy) && !attacked(state, 7, 6, enemy)) {
            moves.push({ from: [7,4], to: [7,6], piece: 'k', castle: 'K' });
          }
          if (state.castling.wQ && !b[7][3] && !b[7][2] && !b[7][1] &&
              !attacked(state, 7, 4, enemy) && !attacked(state, 7, 3, enemy) && !attacked(state, 7, 2, enemy)) {
            moves.push({ from: [7,4], to: [7,2], piece: 'k', castle: 'Q' });
          }
        }
        if (color === 'b' && r === 0 && c === 4) {
          if (state.castling.bK && !b[0][5] && !b[0][6] &&
              !attacked(state, 0, 4, enemy) && !attacked(state, 0, 5, enemy) && !attacked(state, 0, 6, enemy)) {
            moves.push({ from: [0,4], to: [0,6], piece: 'k', castle: 'K' });
          }
          if (state.castling.bQ && !b[0][3] && !b[0][2] && !b[0][1] &&
              !attacked(state, 0, 4, enemy) && !attacked(state, 0, 3, enemy) && !attacked(state, 0, 2, enemy)) {
            moves.push({ from: [0,4], to: [0,2], piece: 'k', castle: 'Q' });
          }
        }
      }
    }
  }
  return moves;
}

function applyMove(state, move) {
  const s = cloneState(state);
  const b = s.board;
  const [fr, fc] = move.from;
  const [tr, tc] = move.to;
  const piece = b[fr][fc];
  const wasCapture = !!b[tr][tc] || move.ep;

  if (move.ep) {
    // captured pawn is on the same rank as the moving pawn's origin, same file as destination
    b[fr][tc] = null;
  }
  b[tr][tc] = { type: piece.type, color: piece.color };
  b[fr][fc] = null;

  if (move.promotion) b[tr][tc].type = move.promotion;

  if (move.castle === 'K') {
    if (piece.color === 'w') { b[7][5] = b[7][7]; b[7][7] = null; }
    else { b[0][5] = b[0][7]; b[0][7] = null; }
  } else if (move.castle === 'Q') {
    if (piece.color === 'w') { b[7][3] = b[7][0]; b[7][0] = null; }
    else { b[0][3] = b[0][0]; b[0][0] = null; }
  }

  // castling rights
  if (piece.type === 'k') {
    if (piece.color === 'w') { s.castling.wK = false; s.castling.wQ = false; }
    else { s.castling.bK = false; s.castling.bQ = false; }
  }
  if (piece.type === 'r') {
    if (fr === 7 && fc === 0) s.castling.wQ = false;
    if (fr === 7 && fc === 7) s.castling.wK = false;
    if (fr === 0 && fc === 0) s.castling.bQ = false;
    if (fr === 0 && fc === 7) s.castling.bK = false;
  }
  if (tr === 7 && tc === 0) s.castling.wQ = false;
  if (tr === 7 && tc === 7) s.castling.wK = false;
  if (tr === 0 && tc === 0) s.castling.bQ = false;
  if (tr === 0 && tc === 7) s.castling.bK = false;

  // en passant target
  s.ep = null;
  if (piece.type === 'p' && Math.abs(tr - fr) === 2) {
    s.ep = { r: (tr + fr) / 2, c: tc };
  }

  s.halfmove = (piece.type === 'p' || wasCapture) ? 0 : s.halfmove + 1;
  if (s.turn === 'b') s.fullmove++;
  s.turn = s.turn === 'w' ? 'b' : 'w';
  return s;
}

function legalMoves(state) {
  const color = state.turn;
  const pseudo = generateMoves(state, color);
  const result = [];
  for (const m of pseudo) {
    const ns = applyMove(state, m);
    if (!kingInCheck(ns, color)) result.push(m);
  }
  return result;
}

/* =========================================================
   AI — minimax with alpha-beta pruning
   ========================================================= */
const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

const PST = {
  p: [
    [0,  0,  0,  0,  0,  0,  0,  0],
    [50, 50, 50, 50, 50, 50, 50, 50],
    [10, 10, 20, 30, 30, 20, 10, 10],
    [5,  5, 10, 25, 25, 10,  5,  5],
    [0,  0,  0, 20, 20,  0,  0,  0],
    [5, -5,-10,  0,  0,-10, -5,  5],
    [5, 10, 10,-20,-20, 10, 10,  5],
    [0,  0,  0,  0,  0,  0,  0,  0]
  ],
  n: [
    [-50,-40,-30,-30,-30,-30,-40,-50],
    [-40,-20,  0,  0,  0,  0,-20,-40],
    [-30,  0, 10, 15, 15, 10,  0,-30],
    [-30,  5, 15, 20, 20, 15,  5,-30],
    [-30,  0, 15, 20, 20, 15,  0,-30],
    [-30,  5, 10, 15, 15, 10,  5,-30],
    [-40,-20,  0,  5,  5,  0,-20,-40],
    [-50,-40,-30,-30,-30,-30,-40,-50]
  ],
  b: [
    [-20,-10,-10,-10,-10,-10,-10,-20],
    [-10,  0,  0,  0,  0,  0,  0,-10],
    [-10,  0,  5, 10, 10,  5,  0,-10],
    [-10,  5,  5, 10, 10,  5,  5,-10],
    [-10,  0, 10, 10, 10, 10,  0,-10],
    [-10, 10, 10, 10, 10, 10, 10,-10],
    [-10,  5,  0,  0,  0,  0,  5,-10],
    [-20,-10,-10,-10,-10,-10,-10,-20]
  ],
  r: [
    [  0,  0,  0,  0,  0,  0,  0,  0],
    [  5, 10, 10, 10, 10, 10, 10,  5],
    [ -5,  0,  0,  0,  0,  0,  0, -5],
    [ -5,  0,  0,  0,  0,  0,  0, -5],
    [ -5,  0,  0,  0,  0,  0,  0, -5],
    [ -5,  0,  0,  0,  0,  0,  0, -5],
    [ -5,  0,  0,  0,  0,  0,  0, -5],
    [  0,  0,  0,  5,  5,  0,  0,  0]
  ],
  q: [
    [-20,-10,-10, -5, -5,-10,-10,-20],
    [-10,  0,  0,  0,  0,  0,  0,-10],
    [-10,  0,  5,  5,  5,  5,  0,-10],
    [ -5,  0,  5,  5,  5,  5,  0, -5],
    [  0,  0,  5,  5,  5,  5,  0, -5],
    [-10,  5,  5,  5,  5,  5,  0,-10],
    [-10,  0,  5,  0,  0,  0,  0,-10],
    [-20,-10,-10, -5, -5,-10,-10,-20]
  ],
  k: [
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-30,-40,-40,-50,-50,-40,-40,-30],
    [-20,-30,-30,-40,-40,-30,-30,-20],
    [-10,-20,-20,-20,-20,-20,-20,-10],
    [ 20, 20,  0,  0,  0,  0, 20, 20],
    [ 20, 30, 10,  0,  0, 10, 30, 20]
  ]
};

function evaluate(state) {
  let score = 0;
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = state.board[r][c];
      if (!p) continue;
      const val = PIECE_VALUES[p.type];
      const table = PST[p.type];
      const pos = p.color === 'w' ? table[r][c] : table[7 - r][c];
      if (p.color === 'w') score += val + pos;
      else score -= val + pos;
    }
  }
  return score;
}

function moveScore(state, m) {
  const target = state.board[m.to[0]][m.to[1]];
  if (target) return PIECE_VALUES[target.type];
  if (m.promotion) return 900;
  return 0;
}

function search(state, depth, alpha, beta) {
  if (depth === 0) return evaluate(state);
  const moves = legalMoves(state);
  if (moves.length === 0) {
    if (kingInCheck(state, state.turn)) {
      return state.turn === 'w' ? -1000000 - depth : 1000000 + depth;
    }
    return 0;
  }
  // order: captures first
  moves.sort((a, b) => moveScore(state, b) - moveScore(state, a));

  if (state.turn === 'w') {
    let best = -Infinity;
    for (const m of moves) {
      const ns = applyMove(state, m);
      const sc = search(ns, depth - 1, alpha, beta);
      if (sc > best) best = sc;
      if (sc > alpha) alpha = sc;
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      const ns = applyMove(state, m);
      const sc = search(ns, depth - 1, alpha, beta);
      if (sc < best) best = sc;
      if (sc < beta) beta = sc;
      if (beta <= alpha) break;
    }
    return best;
  }
}

function findBestMove(state, depth) {
  const moves = legalMoves(state);
  if (moves.length === 0) return null;
  // shuffle for variety
  for (let i = moves.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = moves[i]; moves[i] = moves[j]; moves[j] = t;
  }
  moves.sort((a, b) => moveScore(state, b) - moveScore(state, a));

  let best = null;
  let bestScore = state.turn === 'w' ? -Infinity : Infinity;
  for (const m of moves) {
    const ns = applyMove(state, m);
    const sc = search(ns, depth - 1, -Infinity, Infinity);
    if (state.turn === 'w') {
      if (sc > bestScore) { bestScore = sc; best = m; }
    } else {
      if (sc < bestScore) { bestScore = sc; best = m; }
    }
  }
  return best;
}

/* =========================================================
   GAME STATE
   ========================================================= */
let game = null;
let history = [];       // array of {state, move} for undo
let mouse = { x: -1, y: -1 };
let buttons = [];

function newGame() {
  game = {
    state: initialState(),
    selected: null,
    legalForSelected: [],
    lastMove: null,
    aiThinking: false,
    gameOver: null,
    difficulty: 3,
    playerColor: 'w',
    promotion: null,   // {from, to} awaiting choice
    moveLog: [],       // [{white: 'e2-e4', black: 'e7-e5'}]
    capturedW: [],     // pieces captured from white (so they're black's spoils)
    capturedB: []
  };
  history = [];
}

function pushHistory(state, move) {
  history.push({ state: cloneState(state), move: move });
  if (history.length > 200) history.shift();
}

function undoMove() {
  if (game.aiThinking) return;
  // Undo two moves: player's and AI's
  if (history.length === 0) return;
  let steps = 0;
  while (history.length > 0 && steps < 2) {
    const h = history.pop();
    game.state = h.state;
    steps++;
    // also pop from moveLog
    if (steps === 1) {
      if (game.moveLog.length > 0) {
        const last = game.moveLog[game.moveLog.length - 1];
        if (last.black) last.black = null;
        else if (last.white) { last.white = null; game.moveLog.pop(); }
        if (game.moveLog.length > 0 && !game.moveLog[game.moveLog.length - 1].white) {
          game.moveLog.pop();
        }
      }
    }
  }
  // if it's now AI's turn (shouldn't be), we might want another undo
  if (game.state.turn !== game.playerColor && history.length > 0) {
    // one more undo to get back to player's turn
    const h = history.pop();
    game.state = h.state;
  }
  game.selected = null;
  game.legalForSelected = [];
  game.lastMove = null;
  game.gameOver = null;
  game.promotion = null;
  game.aiThinking = false;
}

/* ---------- MOVE EXECUTION ---------- */
function executeMove(move) {
  const s = game.state;

  // record captures for panel
  if (move.ep) {
    const capturedPawn = s.board[move.from[0]][move.to[1]];
    if (capturedPawn) {
      if (capturedPawn.color === 'b') game.capturedB.push('p');
      else game.capturedW.push('p');
    }
  } else {
    const target = s.board[move.to[0]][move.to[1]];
    if (target) {
      if (target.color === 'b') game.capturedB.push(target.type);
      else game.capturedW.push(target.type);
    }
  }

  pushHistory(s, move);
  game.state = applyMove(s, move);
  game.lastMove = move;
  game.selected = null;
  game.legalForSelected = [];

  // record in log
  const moveStr = squareName(move.from) + '-' + squareName(move.to) +
                  (move.promotion ? '=' + move.promotion.toUpperCase() : '');
  if (s.turn === 'w') {
    game.moveLog.push({ white: moveStr, black: null });
  } else {
    if (game.moveLog.length === 0) game.moveLog.push({ white: null, black: moveStr });
    else game.moveLog[game.moveLog.length - 1].black = moveStr;
  }

  checkGameEnd();
  if (!game.gameOver && game.state.turn !== game.playerColor) {
    triggerAI();
  }
}

function checkGameEnd() {
  const moves = legalMoves(game.state);
  if (moves.length === 0) {
    if (kingInCheck(game.state, game.state.turn)) {
      game.gameOver = {
        type: 'checkmate',
        winner: game.state.turn === 'w' ? 'b' : 'w'
      };
    } else {
      game.gameOver = { type: 'stalemate' };
    }
    return;
  }
  if (game.state.halfmove >= 100) {
    game.gameOver = { type: 'draw50' };
    return;
  }
}

function triggerAI() {
  game.aiThinking = true;
  const thisGame = game;
  setTimeout(function () {
    if (game !== thisGame) return;   // «новая игра» нажата, пока компьютер думал
    const depth = game.difficulty;
    const t0 = performance.now();
    const move = findBestMove(game.state, depth);
    const elapsed = performance.now() - t0;
    const minThink = 320;
    const delay = Math.max(0, minThink - elapsed);
    setTimeout(function () {
      if (game !== thisGame) return;
      if (move) {
        // handle AI promotion (always auto-queen for AI)
        executeMove(move);
      }
      game.aiThinking = false;
    }, delay);
  }, 30);
}

function squareName(pos) {
  const files = 'abcdefgh';
  return files[pos[1]] + (8 - pos[0]);
}

/* =========================================================
   INPUT
   ========================================================= */
function canvasPos(clientX, clientY) {
  const r = cvs.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width * W,
    y: (clientY - r.top) / r.height * H
  };
}

function squareAt(x, y) {
  if (x < BOARD_X || x >= BOARD_X + BOARD_PX) return null;
  if (y < BOARD_Y || y >= BOARD_Y + BOARD_PX) return null;
  const c = Math.floor((x - BOARD_X) / CELL);
  const r = Math.floor((y - BOARD_Y) / CELL);
  return [r, c];
}

function handleClick(x, y) {
  if (!game) return;

  // promotion chooser active?
  if (game.promotion) {
    const choices = ['q', 'r', 'b', 'n'];
    // same boxes as renderPromotionChooser draws
    for (let i = 0; i < 4; i++) {
      const bx = W / 2 - 140 + i * 80;
      const by = H / 2 - 20;
      const size = 62;
      if (x >= bx && x <= bx + size && y >= by && y <= by + size) {
        const move = {
          from: game.promotion.from,
          to: game.promotion.to,
          piece: 'p',
          promotion: choices[i]
        };
        game.promotion = null;
        executeMove(move);
        return;
      }
    }
    return;
  }

  // buttons
  for (const b of buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      if (b.action === 'new') { newGame(); return; }
      if (b.action === 'undo') { undoMove(); return; }
      if (b.action === 'diff1') { game.difficulty = 1; return; }
      if (b.action === 'diff2') { game.difficulty = 2; return; }
      if (b.action === 'diff3') { game.difficulty = 3; return; }
    }
  }

  if (game.gameOver || game.aiThinking) return;
  if (game.state.turn !== game.playerColor) return;

  const sq = squareAt(x, y);
  if (!sq) return;
  const [r, c] = sq;
  const piece = game.state.board[r][c];

  // clicked on a legal destination?
  if (game.selected) {
    const move = game.legalForSelected.find(m =>
      m.to[0] === r && m.to[1] === c && !m.promotion
    );
    if (move) {
      executeMove(move);
      return;
    }
    // promotion?
    const promoMove = game.legalForSelected.find(m =>
      m.to[0] === r && m.to[1] === c && m.promotion
    );
    if (promoMove) {
      game.promotion = { from: promoMove.from, to: promoMove.to };
      return;
    }
  }

  // select a piece
  if (piece && piece.color === game.playerColor) {
    game.selected = [r, c];
    game.legalForSelected = legalMoves(game.state).filter(m =>
      m.from[0] === r && m.from[1] === c
    );
  } else {
    game.selected = null;
    game.legalForSelected = [];
  }
}

cvs.addEventListener('mousemove', function (e) {
  const p = canvasPos(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y;
});

cvs.addEventListener('mousedown', function (e) {
  e.preventDefault();
  const p = canvasPos(e.clientX, e.clientY);
  handleClick(p.x, p.y);
});

cvs.addEventListener('touchstart', function (e) {
  e.preventDefault();
  const t = e.changedTouches[0];
  const p = canvasPos(t.clientX, t.clientY);
  handleClick(p.x, p.y);
}, { passive: false });

/* =========================================================
   RENDERING
   ========================================================= */
function txt(str, x, y, size, col, align, shadow) {
  ctx.font = 'bold ' + size + 'px ui-monospace, "Courier New", monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  if (shadow !== false) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillText(str, x + 2, y + 2);
  }
  ctx.fillStyle = col;
  ctx.fillText(str, x, y);
}

function renderBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#14100a');
  g.addColorStop(0.5, '#0e0a06');
  g.addColorStop(1, '#060402');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // subtle wood grain
  ctx.fillStyle = 'rgba(255,220,150,0.02)';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1);
  }
}

function renderBoard() {
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(BOARD_X + 6, BOARD_Y + 8, BOARD_PX, BOARD_PX);

  // frame
  ctx.fillStyle = '#3a2a1c';
  ctx.fillRect(BOARD_X - 6, BOARD_Y - 6, BOARD_PX + 12, BOARD_PX + 12);
  ctx.fillStyle = '#2a1c10';
  ctx.fillRect(BOARD_X - 4, BOARD_Y - 4, BOARD_PX + 8, BOARD_PX + 8);

  // squares
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const light = (r + c) % 2 === 0;
      const x = BOARD_X + c * CELL;
      const y = BOARD_Y + r * CELL;
      ctx.fillStyle = light ? COL.light : COL.dark;
      ctx.fillRect(x, y, CELL, CELL);

      // subtle pixel edge
      ctx.fillStyle = light ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';
      ctx.fillRect(x, y, CELL, 1);
      ctx.fillRect(x, y, 1, CELL);
    }
  }

  // coordinates
  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const files = 'abcdefgh';
  for (let i = 0; i < 8; i++) {
    // files (a-h) below
    ctx.fillStyle = 'rgba(230,200,150,0.6)';
    ctx.fillText(files[i], BOARD_X + i * CELL + CELL / 2, BOARD_Y + BOARD_PX + 14);
    // ranks (1-8) on left
    ctx.fillStyle = 'rgba(230,200,150,0.6)';
    ctx.fillText(String(8 - i), BOARD_X - 12, BOARD_Y + i * CELL + CELL / 2);
  }

  // highlights: last move
  if (game.lastMove) {
    const from = game.lastMove.from;
    const to = game.lastMove.to;
    ctx.fillStyle = COL.lastMove;
    ctx.fillRect(BOARD_X + from[1] * CELL, BOARD_Y + from[0] * CELL, CELL, CELL);
    ctx.fillRect(BOARD_X + to[1] * CELL, BOARD_Y + to[0] * CELL, CELL, CELL);
  }

  // highlight selected
  if (game.selected) {
    const [r, c] = game.selected;
    ctx.fillStyle = COL.sel;
    ctx.fillRect(BOARD_X + c * CELL, BOARD_Y + r * CELL, CELL, CELL);
  }

  // highlight king in check
  if (!game.gameOver) {
    const inCheck = kingInCheck(game.state, game.state.turn);
    if (inCheck) {
      const kp = kingPos(game.state, game.state.turn);
      if (kp) {
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 200);
        ctx.fillStyle = 'rgba(230,40,40,' + (0.35 + 0.35 * pulse) + ')';
        ctx.fillRect(BOARD_X + kp[1] * CELL, BOARD_Y + kp[0] * CELL, CELL, CELL);
      }
    }
  }

  // legal move hints
  for (const m of game.legalForSelected) {
    const [r, c] = m.to;
    const x = BOARD_X + c * CELL + CELL / 2;
    const y = BOARD_Y + r * CELL + CELL / 2;
    const isCapture = game.state.board[r][c] || m.ep;
    if (isCapture) {
      // ring
      ctx.strokeStyle = COL.capture;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(x, y, CELL / 2 - 6, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      // dot
      ctx.fillStyle = COL.moveDot;
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function renderPieces() {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = game.state.board[r][c];
      if (!p) continue;
      const spr = PIECE_SPRITES[p.color][p.type];
      const x = BOARD_X + c * CELL;
      const y = BOARD_Y + r * CELL;
      // sprite is (14x14); draw centered in cell at 52x52
      const targetSize = 54;
      const offset = (CELL - targetSize) / 2;
      ctx.drawImage(spr, x + offset, y + offset, targetSize, targetSize);
    }
  }
}

function renderSidePanels() {
  // Left panel — player info + captured pieces
  ctx.fillStyle = 'rgba(20,16,10,0.85)';
  ctx.fillRect(LEFT_X, BOARD_Y - 6, PANEL_W, BOARD_PX + 12);
  ctx.strokeStyle = COL.panelEdge;
  ctx.lineWidth = 2;
  ctx.strokeRect(LEFT_X + 1, BOARD_Y - 5, PANEL_W - 2, BOARD_PX + 10);

  txt('ВЫ', LEFT_X + 14, BOARD_Y + 24, 18, COL.white);
  txt('(БЕЛЫЕ)', LEFT_X + 14, BOARD_Y + 44, 12, COL.dim);

  // captured black pieces = player's spoils
  txt('ВЗЯТО:', LEFT_X + 14, BOARD_Y + 76, 12, COL.dim);
  drawCapturedRow(game.capturedB, LEFT_X + 14, BOARD_Y + 86, 'b');

  // divider
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(LEFT_X + 12, BOARD_Y + 210, PANEL_W - 24, 2);

  txt('КОМПЬЮТЕР', LEFT_X + 14, BOARD_Y + 240, 16, COL.black === '#1a1a1a' ? '#d0d0d0' : COL.black);
  txt('(ЧЁРНЫЕ)', LEFT_X + 14, BOARD_Y + 258, 12, COL.dim);

  txt('ВЗЯТО:', LEFT_X + 14, BOARD_Y + 290, 12, COL.dim);
  drawCapturedRow(game.capturedW, LEFT_X + 14, BOARD_Y + 300, 'w');

  // Right panel — move history
  ctx.fillStyle = 'rgba(20,16,10,0.85)';
  ctx.fillRect(RIGHT_X, BOARD_Y - 6, PANEL_W, BOARD_PX + 12);
  ctx.strokeStyle = COL.panelEdge;
  ctx.lineWidth = 2;
  ctx.strokeRect(RIGHT_X + 1, BOARD_Y - 5, PANEL_W - 2, BOARD_PX + 10);

  txt('ХОДЫ', RIGHT_X + 14, BOARD_Y + 24, 16, COL.gold);

  ctx.font = 'bold 12px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const startIdx = Math.max(0, game.moveLog.length - 24);
  let y = BOARD_Y + 48;
  for (let i = startIdx; i < game.moveLog.length; i++) {
    const m = game.moveLog[i];
    const num = String(i + 1).padStart(2, ' ');
    ctx.fillStyle = COL.dim;
    ctx.fillText(num + '.', RIGHT_X + 10, y);
    ctx.fillStyle = COL.text;
    ctx.fillText(m.white || '...', RIGHT_X + 40, y);
    ctx.fillStyle = '#a09080';
    ctx.fillText(m.black || '', RIGHT_X + 100, y);
    y += 17;
    if (y > BOARD_Y + BOARD_PX - 10) break;
  }
}

function drawCapturedRow(captured, x, y, color) {
  // render tiny captured pieces in a row, wrapping
  const size = 22;
  const perRow = 6;
  for (let i = 0; i < captured.length; i++) {
    const row = Math.floor(i / perRow);
    const col = i % perRow;
    const px = x + col * (size + 2);
    const py = y + row * (size + 2);
    const spr = PIECE_SPRITES[color][captured[i]];
    ctx.drawImage(spr, px, py, size, size);
  }
}

function renderTopBar() {
  // Header
  ctx.fillStyle = 'rgba(20,16,10,0.85)';
  ctx.fillRect(0, 0, W, 92);
  ctx.fillStyle = 'rgba(180,140,90,0.25)';
  ctx.fillRect(0, 90, W, 2);

  txt('ПИКСЕЛЬ-ШАХМАТЫ', 24, 40, 26, COL.gold);
  txt('против компьютера · без риска', 24, 62, 12, COL.dim);

  // Status message
  let statusText = '';
  let statusCol = COL.text;
  if (game.gameOver) {
    if (game.gameOver.type === 'checkmate') {
      if (game.gameOver.winner === 'w') {
        statusText = 'МАТ! ПОБЕДА БЕЛЫХ';
        statusCol = COL.green;
      } else {
        statusText = 'МАТ! ПОБЕДА ЧЁРНЫХ';
        statusCol = COL.red;
      }
    } else if (game.gameOver.type === 'stalemate') {
      statusText = 'ПАТ — НИЧЬЯ';
      statusCol = COL.gold;
    } else if (game.gameOver.type === 'draw50') {
      statusText = 'НИЧЬЯ (50 ХОДОВ)';
      statusCol = COL.gold;
    }
  } else if (game.aiThinking) {
    statusText = 'КОМПЬЮТЕР ДУМАЕТ...';
    statusCol = '#7ad3ff';
  } else {
    const inCheck = kingInCheck(game.state, game.state.turn);
    if (game.state.turn === 'w') {
      statusText = inCheck ? 'ВАШ ХОД · ШАХ!' : 'ВАШ ХОД';
      statusCol = inCheck ? COL.red : COL.green;
    } else {
      statusText = inCheck ? 'ХОД ЧЁРНЫХ · ШАХ!' : 'ХОД ЧЁРНЫХ';
      statusCol = inCheck ? COL.red : '#c0c0c0';
    }
  }

  const pulse = game.gameOver ? (0.7 + 0.3 * Math.sin(performance.now() / 260)) : 1;
  ctx.globalAlpha = pulse;
  txt(statusText, W / 2, 48, 24, statusCol, 'center');
  ctx.globalAlpha = 1;

  // Difficulty selector
  txt('СЛОЖНОСТЬ:', W - 320, 40, 13, COL.dim);
  const diffs = ['ЛЁГКИЙ', 'СРЕДНИЙ', 'СЛОЖНЫЙ'];
  for (let i = 0; i < 3; i++) {
    const bx = W - 240 + i * 78;
    const by = 24;
    const bw = 74, bh = 28;
    const active = game.difficulty === i + 1;
    ctx.fillStyle = active ? 'rgba(255,217,61,0.85)' : 'rgba(40,32,22,0.9)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = active ? COL.gold : 'rgba(160,130,90,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
    txt(diffs[i], bx + bw / 2, by + 20, 12, active ? '#1a0f00' : COL.text, 'center', false);

    buttons.push({
      x: bx, y: by, w: bw, h: bh,
      action: 'diff' + (i + 1)
    });
  }
}

function renderBottomBar() {
  // Buttons row
  buttons.length = 0;
  renderTopBar();  // repopulates difficulty buttons

  const btnY = H - 70;
  const btnH = 46;

  // New game
  const nbX = BOARD_X;
  const nbW = 160;
  const nHover = mouse.x >= nbX && mouse.x <= nbX + nbW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  ctx.fillStyle = nHover ? 'rgba(60,180,110,0.95)' : 'rgba(30,120,72,0.9)';
  ctx.fillRect(nbX, btnY, nbW, btnH);
  ctx.strokeStyle = '#4be0a8';
  ctx.lineWidth = 2;
  ctx.strokeRect(nbX + 1, btnY + 1, nbW - 2, btnH - 2);
  txt('НОВАЯ ИГРА', nbX + nbW / 2, btnY + 30, 16, '#ffffff', 'center');
  buttons.push({ x: nbX, y: btnY, w: nbW, h: btnH, action: 'new' });

  // Undo
  const ubX = BOARD_X + nbW + 20;
  const ubW = 140;
  const uHover = mouse.x >= ubX && mouse.x <= ubX + ubW && mouse.y >= btnY && mouse.y <= btnY + btnH;
  const canUndo = history.length > 0 && !game.aiThinking;
  ctx.fillStyle = !canUndo ? 'rgba(40,34,26,0.6)' : (uHover ? 'rgba(80,68,48,0.95)' : 'rgba(54,46,34,0.9)');
  ctx.fillRect(ubX, btnY, ubW, btnH);
  ctx.strokeStyle = canUndo ? 'rgba(200,170,120,0.7)' : 'rgba(120,100,70,0.4)';
  ctx.lineWidth = 2;
  ctx.strokeRect(ubX + 1, btnY + 1, ubW - 2, btnH - 2);
  txt('ОТМЕНИТЬ', ubX + ubW / 2, btnY + 30, 16, canUndo ? COL.text : COL.dim, 'center');
  if (canUndo) buttons.push({ x: ubX, y: btnY, w: ubW, h: btnH, action: 'undo' });

  // Hint text
  if (!game.gameOver && !game.aiThinking && game.state.turn === game.playerColor) {
    txt('КЛИКНИТЕ ПО ФИГУРЕ, ЗАТЕМ ПО ПОЛЮ', W - 24, btnY + 30, 14, COL.dim, 'right');
  }
}

function renderPromotionChooser() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);

  const bx = W / 2 - 180;
  const by = H / 2 - 70;
  const bw = 360, bh = 140;

  ctx.fillStyle = 'rgba(24,18,12,0.96)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = COL.gold;
  ctx.lineWidth = 3;
  ctx.strokeRect(bx + 2, by + 2, bw - 4, bh - 4);

  txt('ВЫБЕРИТЕ ФИГУРУ', W / 2, by + 30, 18, COL.gold, 'center');

  const choices = ['q', 'r', 'b', 'n'];
  const names = ['ФЕРЗЬ', 'ЛАДЬЯ', 'СЛОН', 'КОНЬ'];
  for (let i = 0; i < 4; i++) {
    const cx = bx + 40 + i * 80;
    const cy = by + 50;
    const size = 62;
    const hovered = mouse.x >= cx && mouse.x <= cx + size && mouse.y >= cy && mouse.y <= cy + size;

    ctx.fillStyle = hovered ? 'rgba(255,217,61,0.20)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(cx, cy, size, size);
    ctx.strokeStyle = hovered ? COL.gold : 'rgba(160,130,90,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(cx + 1, cy + 1, size - 2, size - 2);

    const spr = PIECE_SPRITES[game.state.turn === 'w' ? 'w' : 'b'][choices[i]];
    ctx.drawImage(spr, cx + 4, cy + 4, size - 8, size - 8);

    txt(names[i], cx + size / 2, cy + size + 12, 10, COL.dim, 'center');
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  renderBackground();
  renderBoard();
  renderPieces();
  renderSidePanels();
  renderBottomBar();
  renderTopBar();

  // Game over overlay
  if (game.gameOver) {
    const y0 = BOARD_Y + BOARD_PX / 2 - 60;
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, y0, W, 120);
    ctx.fillStyle = COL.gold;
    ctx.fillRect(0, y0, W, 3);
    ctx.fillRect(0, y0 + 117, W, 3);

    let msg = '';
    let col = COL.text;
    if (game.gameOver.type === 'checkmate') {
      msg = game.gameOver.winner === 'w' ? 'МАТ! ВЫ ПОБЕДИЛИ' : 'МАТ! ВЫ ПРОИГРАЛИ';
      col = game.gameOver.winner === 'w' ? COL.green : COL.red;
    } else if (game.gameOver.type === 'stalemate') {
      msg = 'ПАТ — НИЧЬЯ';
      col = COL.gold;
    } else if (game.gameOver.type === 'draw50') {
      msg = 'НИЧЬЯ (ПРАВИЛО 50 ХОДОВ)';
      col = COL.gold;
    }
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 260);
    ctx.globalAlpha = pulse;
    txt(msg, W / 2, y0 + 56, 38, col, 'center');
    ctx.globalAlpha = 1;
    txt('НАЖМИТЕ «НОВАЯ ИГРА»', W / 2, y0 + 92, 15, COL.dim, 'center');
  }

  if (game.promotion) renderPromotionChooser();
}

/* =========================================================
   LOOP
   ========================================================= */
newGame();

function loop() {
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
