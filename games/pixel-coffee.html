function fmtMoney(v){
  const neg = v < 0;
  const abs = Math.abs(v);
  const s = String(abs).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

}

let actx=null;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,dur,type,vol,delay){
  const a=audio(); if(!a) return;
  const t0=a.currentTime+(delay||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.035,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.04);
}
function noiseBurst(dur,vol,cut){
  const a=audio(); if(!a) return;
  const len=Math.floor(a.sampleRate*dur);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.createBufferSource(); src.buffer=buf;
  const g=a.createGain(); g.gain.value=vol||0.02;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||2000;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}

function pickSpecial(){
  const total = SPECIALS.reduce((s,x)=>s+x.weight, 0);
  let r = Math.random() * total;
  for(const s of SPECIALS){
    r -= s.weight;
    if(r <= 0) return s;
  }
  return SPECIALS[0];
}

function drawSpecialCustomer(c){
  if(!c) return;
  if(c.boss){
    const baseX = c.x | 0;
    let tremor = 0;
    if(c.state === 'sip') tremor = Math.round(Math.sin(c.bob*22)*1);
    if(c.state === 'spit') tremor = Math.round(Math.sin(c.bob*32)*2);
    if(c.curse) tremor = Math.round(Math.sin(state.t*40)*2);
    drawBoss(baseX + tremor, 72, c);
    return;
  }
  if(!c.special) return;
  const baseX = c.x | 0;
  let tremor = 0;
  if(c.state === 'sip') tremor = Math.round(Math.sin(c.bob*22)*1);
  if(c.state === 'spit') tremor = Math.round(Math.sin(c.bob*32)*2);
  if(c.curse) tremor = Math.round(Math.sin(state.t*40)*1);
  const x = baseX + tremor;
  const y = 72;
  switch(c.special.id){
    case 'mario':  drawMario(x, y, c); break;
    case 'luigi':  drawLuigi(x, y, c); break;
    case 'pacman': drawPacman(x, y, c); break;
    case 'ghost':  drawGhost(x, y, c); break;
    case 'smurf':  drawSmurf(x, y, c); break;
    case 'sonic':  drawSonic(x, y, c); break;
  }
}

function drawPacman(x, y, c){
  const t = state.t;
  const sipping = c.state === 'sip';
  const spitting = c.state === 'spit';
  const cursing = !!c.curse;
  const angry = c.mood === 'angry';
  const happy = c.mood === 'happy';
  const walking = c.state === 'in' || c.state === 'out';
  ctx.globalAlpha = 0.25; R(x-22, y+56, 44, 4, '#000000'); ctx.globalAlpha = 1;

  const cx = x, cy = y + 30, r = 22;
  const bob = Math.round(Math.sin(c.bob*2.4)) * 2;
  let mouthAngle;
  if(sipping) mouthAngle = 0.05;
  else if(spitting || cursing) mouthAngle = 1.4;
  else if(angry) mouthAngle = 0.6 + Math.abs(Math.sin(t*8))*0.3;
  else if(happy) mouthAngle = 0.35 + Math.abs(Math.sin(t*3))*0.2;
  else if(walking) mouthAngle = 0.4 + Math.abs(Math.sin(t*10))*0.4;
  else mouthAngle = 0.15 + Math.abs(Math.sin(t*4))*0.35;

  R(x-32, cy-4, 4, 4, '#f0d020');

  R(cx - r, cy - r + bob, r*2, r*2, '#f0d020');
  R(cx - r + 4, cy - r + 4 + bob, 6, 6, '#fff080');
  ctx.save();
  ctx.beginPath();
  ctx.rect(cx - r, cy - r + bob, r*2, r*2);
  ctx.clip();
  ctx.fillStyle = '#3a2418';
  ctx.beginPath();
  ctx.moveTo(cx, cy + bob);
  const dy = Math.round(Math.sin(mouthAngle) * r * 1.3);
  ctx.lineTo(cx + r + 2, cy - dy + bob);
  ctx.lineTo(cx + r + 2, cy + dy + bob);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  R(cx - 3, cy - 12 + bob, 3, 6, '#000000');
  R(cx - 2, cy - 11 + bob, 1, 2, '#ffffff');
  R(x-30, cy + 4 + bob, 6, 5, '#f0d020');

    R(cx + 12, cy - 26 + bob, 3, 1, '#ff3030');
    R(cx + 11, cy - 25 + bob, 5, 1, '#ff3030');
    R(cx + 14, cy - 27 + bob, 1, 5, '#ff3030');
  }
  if(happy){
    for(let i=0;i<4;i++){
      const a = t*3 + i*1.5;
      const sx = cx + Math.cos(a)*30, sy = cy + Math.sin(a)*20;
      R(sx - 2, sy, 5, 1, '#ffe070');
      R(sx, sy - 2, 1, 5, '#ffe070');
    }
  }
}

const P = [];
function addP(x,y,vx,vy,life,col,size,grav,type){
  if(P.length>260) return;
  P.push({x,y,vx,vy,life,max:life,col,size:size||1,grav:grav||0,type:type||'dot'});
}
function updateP(dt){
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += p.grav*dt;
    if(p.type==='steam') p.vx += (Math.random()-0.5)*10*dt;
    p.life -= dt;
    if(p.life<=0) P.splice(i,1);
  }
}
function drawP(){
  for(const p of P){
    const a = clamp(p.life/p.max,0,1);
    if(p.type==='steam'){
      ctx.globalAlpha = a*0.35;
      const s = p.size*(1+(1-p.life/p.max)*1.4);
      R(p.x-s/2, p.y-s/2, s, s, '#e8e0d0');
      if(s>2){
        ctx.globalAlpha = a*0.15;
        R(p.x-s*0.8, p.y-s*0.8, s*1.6, s*1.6, '#ffffff');
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = a;
      R(p.x, p.y, p.size, p.size, p.col);
      ctx.globalAlpha = 1;
    }
  }
}

function updateSpitParts(dt){
  for(let i=state.spitParts.length-1; i>=0; i--){
    const sp = state.spitParts[i];
    sp.t += dt;
    const p = clamp(sp.t / sp.dur, 0, 1);
    const e = 1 - (1-p)*(1-p);
    sp.x = lerp(sp.sx, sp.tx, e);
    sp.y = lerp(sp.sy, sp.ty, e);
    sp.size = Math.max(1, Math.round(lerp(1, sp.maxSize, p*p)));
    if(p >= 1){
      state.splats.push({ x: sp.tx, y: sp.ty, r: Math.max(3, Math.round(sp.maxSize*1.1)), life: 3.0, max: 3.0, col: sp.col, seed: Math.random() });
      state.spitParts.splice(i, 1);
      for(let k=0;k<4;k++){
        state.splats.push({ x: sp.tx + rnd(-sp.maxSize, sp.maxSize), y: sp.ty + rnd(-sp.maxSize, sp.maxSize), r: Math.max(1, Math.round(rnd(1, 3))), life: rnd(2.0, 3.0), max: 3.0, col: sp.col, seed: Math.random() });
      }
    }
  }
  for(let i=state.splats.length-1; i>=0; i--){
    const s = state.splats[i];
    s.life -= dt;
    if(s.life <= 0) state.splats.splice(i, 1);
  }
}

  R(cxp-topHalf, topY, topHalf*2, 1, '#ffffff');
  const ix = cxp - topHalf + 3, iy = topY + 3;
  const iw = (topHalf-3)*2, ih = h - 6;
  R(ix-1, iy-1, iw+2, ih+2, '#c8c0b0');
  R(ix, iy, iw, ih, '#160c06');
  const n = state.cup.length;
  if(n > 0){
    const lh = ih / n;
    for(let i=0;i<n;i++){
      const ly = iy + ih - (i+1)*lh;
      const ing = ING[state.cup[i]];
      R(ix, ly, iw, lh+0.5, ing.col);
      R(ix, ly, iw, Math.max(1, lh*0.35), ing.col2);
      R(ix, ly, 1, lh, ing.hi);
    }
    const topLy = iy + ih - n*lh;
    R(ix+1, topLy, iw-2, 1, 'rgba(255,255,255,0.25)');
  }
  if(n > 0){
    for(let i=0;i<3;i++){
      const sx = ix + 4 + i*(iw/3);
      const phase = (state.t*6 + i*2.1) % 9;
      const sy = iy - 3 - phase;
      const a = 1 - phase/9;
      ctx.globalAlpha = 0.4*a;
      R(sx, sy, 2, 2, '#e8e0d0');
      ctx.globalAlpha = 1;
    }
  }
  if(state.pour){
    const ing = ING[state.pour.ing];
    const startY = topY - 30, endY = cupLiquidTop() + 1;
    R(cxp - 1, startY, 2, endY - startY, ing.col2);
    R(cxp - 1, startY, 1, endY - startY, ing.hi);
    R(cxp - 10, startY - 6, 20, 7, '#c8c0b0');
    R(cxp - 10, startY - 6, 20, 1, '#f0e8d8');
    R(cxp - 8, startY - 5, 16, 3, ing.col);
  }
}

function drawCustomer(c){
  if(!c) return;
  if(c.boss || c.special){ drawSpecialCustomer(c); return; }
  const baseX = c.x | 0;
  let tremor = 0;
  if(c.state === 'sip') tremor = Math.round(Math.sin(c.bob*22)*1);
  if(c.state === 'spit') tremor = Math.round(Math.sin(c.bob*32)*2);
  if(c.curse) tremor = Math.round(Math.sin(state.t*40)*1);
  const x = baseX + tremor;
  const bob = customerBob(c);
  const y = 72 + bob;
  const f = c.face;
  const walking = c.state === 'in' || c.state === 'out';
  const swing = walking ? Math.round(Math.sin(c.bob*8)*3) : 0;
  R(x-16, y+22, 32, 36, f.shirt);
  R(x+10, y+22, 6, 36, f.shirt2);
  R(x-10, y+30, 20, 28, '#3a2414');
  R(x-6, y+22, 12, 3, '#e8e0d0');
  R(x-20, y+24+swing, 4, 24, f.shirt);
  R(x+16, y+24-swing, 4, 24, f.shirt);
  R(x-19, y+46+swing, 3, 5, f.skin);
  R(x+17, y+46-swing, 3, 5, f.skin);
  R(x-4, y+18, 8, 5, f.skin);
  R(x-10, y+4, 20, 16, f.skin);
  R(x-10, y+4, 20, 1, f.hi);
  R(x+8, y+5, 2, 15, f.sh);
  R(x-12, y+10, 2, 5, f.skin);
  R(x+10, y+10, 2, 5, f.skin);
  drawHair(c, x, y, f);
  const eyeY = y + 11;
  const angry = c.mood === 'angry';
  const happy = c.mood === 'happy';
  const blink = c.blink > 0;

  if(spitting || cursing){
    R(x-8, eyeY-2, 5, 6, '#ffffff');

    R(x+4, eyeY-1, 3, 3, f.eye);
    R(x-8, eyeY-5, 4, 1, f.hair);
    R(x+4, eyeY-5, 4, 1, f.hair);

    R(x-7, eyeY+1, 4, 1, '#3a2418');
    R(x+3, eyeY+1, 4, 1, '#3a2418');

    R(x-7, eyeY+1, 4, 1, '#3a2418');

    R(x+4, eyeY, 2, 1, '#3a2418');
    R(x+6, eyeY+1, 1, 1, '#3a2418');

    R(x-6, eyeY, 2, 2, '#1a1008');
    R(x+4, eyeY, 2, 2, '#1a1008');

    R(x+4, eyeY-3, 4, 1, f.hair);
  } else {
    R(x-7, eyeY, 3, 3, '#ffffff');
    R(x+4, eyeY, 3, 3, '#ffffff');
    R(x-6, eyeY+1, 2, 1, f.eye);
    R(x+5, eyeY+1, 2, 1, f.eye);
  }
  R(x-1, y+13, 2, 2, f.sh);
  const mouthY = y + 17;
  if(spitting || cursing){

    R(x-4, mouthY, 8, 4, '#5e3418');
    R(x-2, mouthY+3, 4, 2, '#c06060');
    R(x-5, mouthY-2, 10, 1, '#f0e8d0');

    R(x-2, mouthY, 4, 2, '#8a4028');

    R(x-3, mouthY+1, 6, 1, '#6a2418');

    R(x-3, mouthY, 6, 1, '#8a4028');
  } else {
    R(x-2, mouthY+1, 4, 1, '#8a4028');
  }
  if(happy){
    ctx.globalAlpha = 0.5;
    R(x-8, y+14, 3, 2, '#e08080');
    R(x+5, y+14, 3, 2, '#e08080');
    ctx.globalAlpha = 1;
  }
  if(angry || spitting || cursing){
    ctx.globalAlpha = 0.5;
    R(x-8, y+14, 3, 2, '#c05040');

function drawBubble(c){
  if(!c) return;
  if(c.state !== 'wait' && c.state !== 'in') return;
  const cx = c.x | 0;
  const name = c.recipe.n;
  const steps = c.recipe.s;
  let subName = null;
  if(c.boss) subName = 'БОСС';
  else if(c.special) subName = c.special.name;

  ctx.font = '8px monospace';
  const tw = ctx.measureText(name).width;
  const chipsW = steps.length * 9 - 2;
  let nameW = tw + 16;
  if(subName){
    ctx.font = 'bold 7px monospace';
    nameW = Math.max(nameW, ctx.measureText(subName).width + 22);
  }
  const w = Math.max(nameW, chipsW + 16, 56);
  const h = subName ? 32 : 26;
  const x = cx - w/2 | 0;
  const y = subName ? 14 : 20;

  R(x+2, y+2, w, h, 'rgba(0,0,0,0.5)');
  let bubCol, bubShadow, bubHighlight;
  if(c.boss){
    bubCol = '#ffe680';
    bubShadow = '#b08820';
    bubHighlight = '#fffce0';
  } else if(subName){
    bubCol = '#f0d8b0';
    bubShadow = '#c8a878';
    bubHighlight = '#ffffff';
  } else {
    bubCol = '#f6ecd8';
    bubShadow = '#c8b898';
    bubHighlight = '#ffffff';
  }
  R(x, y, w, h, bubCol);
  R(x, y, w, 1, bubHighlight);
  R(x+w-1, y, 1, h, bubShadow);
  R(x, y+h-1, w, 1, bubShadow);
  R(cx-3, y+h, 6, 2, bubCol);
  R(cx-2, y+h+2, 4, 2, bubCol);

  if(subName){
    let markerCol = c.boss ? '#f0c040' : '#f0c040';
    R(x+3, y+3, 3, 3, markerCol);
    R(x+3, y+3, 3, 1, '#ffffff');
    const subCol = c.boss ? '#8a5010' : '#8a4020';
    T(subName, cx + 4, y+3, subCol, 7, 'center');
    T(name, cx, y+13, '#3a2418', 8, 'center');
    let sx = cx - chipsW/2 | 0;
    for(let i=0;i<steps.length;i++){
      const ing = ING[steps[i]];
      R(sx, y+22, 7, 7, ing.col);
      R(sx, y+22, 7, 1, ing.hi);
      sx += 9;
    }
    const pr = clamp(c.patience, 0, 1);
    const barW = w - 8;
    R(x+4, y+h-4, barW, 2, 'rgba(0,0,0,0.2)');
    const col = pr > 0.5 ? '#5ac45a' : pr > 0.25 ? '#e8c040' : '#e05050';
    R(x+4, y+h-4, Math.max(0, barW*pr), 2, col);
  } else {
    T(name, cx, y+4, '#3a2418', 8, 'center');
    let sx = cx - chipsW/2 | 0;
    for(let i=0;i<steps.length;i++){
      const ing = ING[steps[i]];
      R(sx, y+15, 7, 7, ing.col);
      R(sx, y+15, 7, 1, ing.hi);
      sx += 9;
    }
    const pr = clamp(c.patience, 0, 1);
    const barW = w - 8;
    R(x+4, y+h-4, barW, 2, 'rgba(0,0,0,0.2)');
    const col = pr > 0.5 ? '#5ac45a' : pr > 0.25 ? '#e8c040' : '#e05050';
    R(x+4, y+h-4, Math.max(0, barW*pr), 2, col);
  }
}

function drawCurseBubble(c){
  if(!c || !c.curse) return;
  const cx = c.x | 0;
  const text = c.curse.text;
  ctx.font = 'bold 11px monospace';
  const tw = ctx.measureText(text).width;
  const w = tw + 16, h = 18;
  const jitterX = Math.round(Math.sin(state.t*45) * 1.5);
  const jitterY = Math.round(Math.cos(state.t*38) * 1.2);
  const x = cx - w/2 + jitterX | 0;
  const y = 22 + jitterY;
  const lifeR = c.curse.t / c.curse.max;
  let alpha = 1;
  if(lifeR > 0.9) alpha = (1 - lifeR) / 0.1;
  else if(lifeR < 0.25) alpha = lifeR / 0.25;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  R(x+2, y+2, w, h, 'rgba(0,0,0,0.6)');
  R(x, y, w, h, '#2a0808');
  R(x, y, w, 1, '#a03030');
  R(cx-3+jitterX, y+h, 6, 2, '#2a0808');
  R(cx-2+jitterX, y+h+2, 4, 2, '#2a0808');
  ctx.globalAlpha = clamp(alpha * 0.4, 0, 1);
  T(text, cx+1, y+4, '#ff2020', 11, 'center');
  T(text, cx-1, y+4, '#ff2020', 11, 'center');
  ctx.globalAlpha = clamp(alpha, 0, 1);
  T(text, cx, y+4, '#ffb0b0', 11, 'center');
  ctx.globalAlpha = 1;
}

  T(balStr, W/2, 80, balCol, 18, 'center');

  T('Обслужено: '+state.served, W/2, 104, '#c8a880', 8, 'center');
  T('Макс. комбо: ×'+comboMultFor(state.bestCombo), W/2, 116, '#c8a880', 8, 'center');

  const tipCol = (state.totalTips - state.totalLost) < 0 ? '#ff8080' : '#ffd070';
  T('Чаевые: ' + fmtMoney(state.totalTips), W/2, 128, '#ffd070', 8, 'center');
  T('Штрафы: ' + fmtMoney(-state.totalLost), W/2, 140, '#ff8080', 8, 'center');

  if(state.bossesSeen > 0){
    const bCol = state.bossWins > state.bossLosses ? '#ffd040' : '#ff8080';
    T('БОССОВ: '+state.bossesSeen+' (побед '+state.bossWins+' / проигр. '+state.bossLosses+')',
      W/2, 152, bCol, 7, 'center');
  }

  const blink = Math.sin(state.t*4) > -0.35;
  if(blink) T('НАЖМИ, ЧТОБЫ НАЧАТЬ ЗАНОВО', W/2, 168, '#8ce070', 8, 'center');
}

/* ═══════════════════════════════════════════════════════════════
   LOGIC
   ═══════════════════════════════════════════════════════════════ */
function comboMultFor(c){ return clamp(1 + Math.floor(c/3), 1, 4); }
function comboMult(){ return comboMultFor(state.combo); }
function maxRecipeLen(){
  if(state.served < 2) return 1;
  if(state.served < 6) return 2;
  if(state.served < 14) return 3;
  return 4;
}
function spawnCustomer(){
  const maxLen = maxRecipeLen();
  const pool = RECIPES.filter(r => r.s.length <= maxLen);
  let recipe, guard = 0;
  do { recipe = pick(pool); guard++; }
  while (pool.length > 1 && recipe === state.lastRecipe && guard < 20);
  state.lastRecipe = recipe;
  const diff = Math.min(1, state.served / 18);
  const maxP = 24 - diff * 13;

  const roll = Math.random();
  let boss = false;
  let special = null;
  if(roll < 0.05){
    boss = true;
  } else if(roll < 0.05 + 0.18){
    special = pickSpecial();
  }

  state.customer = {
    x: W + 40,
    targetX: 210 + rnd(-20, 20),
    recipe: recipe,
    patience: 1,
    maxPatience: maxP,
    state: 'in',
    bob: 0,
    mood: 'ok',
    blink: 2 + Math.random()*3,
    face: pick(FACES),
    special: special,
    boss: boss,
    sipT: 0,
    curse: null
  };
  state.cup = [];

  if(boss){
    bossArriveSound();
    state.bossesSeen++;
    state.shake = 0.7;
    state.flash = 0.4;
    state.flashCol = '#ffd040';
    for(let i=0;i<30;i++){
      addP(rnd(0, W), rnd(0, H),
           rnd(-80,80), rnd(-120,-20),
           rnd(0.8,1.6), pick(['#ffe070','#ffd040','#ffffff','#ffb040']),
           Math.random()<0.5?2:1, 60);
    }
    setTimeout(()=>addFloat('★★★ БОСС ★★★', W/2, 60, '#ffd040', 14), 100);
  } else if(special){
    specialArriveSound();
    state.specialsSeen++;
    for(let i=0;i<10;i++){
      addP(W-20, rnd(60, 120), rnd(-60,-20), rnd(-40,40),
           rnd(0.5,1.0), pick(['#ffe070','#ffffff','#ffd040']),
           Math.random()<0.5?2:1, 40);
    }
  } else {
    tone(660, 0.05, 'square', 0.028);
    tone(880, 0.07, 'square', 0.028, 0.07);
  }
}
function addIngredient(ing){
  if(state.phase !== 'play') return;
  const c = state.customer;
  if(!c || c.state !== 'wait') return;
  if(state.cup.length >= 4) return;
  state.cup.push(ing);
  state.pour = {ing, t: 0.4, max: 0.4};
  state.pulse = 1;
  tone(420 + state.cup.length * 100, 0.05, 'square', 0.032);
  noiseBurst(0.08, 0.015, 1400);
  for(let i=0;i<5;i++){
    addP(CUP_CX + rnd(-6,6), cupLiquidTop(), rnd(-20,20), rnd(-30,-10),
         rnd(0.35,0.6), ING[ing].hi, 1, 120);
  }
}
function clearCup(){
  if(state.phase !== 'play') return;
  const c = state.customer;
  if(!c || c.state !== 'wait') return;
  if(state.cup.length === 0) return;
  state.cup = [];
  state.pulse = 0.6;
  tone(240, 0.09, 'triangle', 0.03);
  noiseBurst(0.12, 0.02, 900);
}
function serve(){
  if(state.phase !== 'play') return;
  const c = state.customer;
  if(!c || c.state !== 'wait') return;
  if(state.cup.length === 0){
    addFloat('ПУСТО!', c.x, 60, '#e0a040');
    tone(200, 0.1, 'triangle', 0.03);
    return;
  }
  const target = c.recipe.s;
  const ok = state.cup.length === target.length && state.cup.every((v,i)=> v === target[i]);

  if(ok){
    state.combo++;
    if(state.combo > state.bestCombo) state.bestCombo = state.combo;
    const mult = comboMult();
    c.mood = 'happy';

    /* ═══════════════════════════════════════════
       ПРАВИЛЬНЫЙ НАПИТОК
       ═══════════════════════════════════════════ */
    if(c.boss){
      // БОСС доволен — МИЛЛИОН!
      const million = 1000000;
      state.money += million;
      state.totalTips += million;
      state.bossWins++;

      addFloat('+$1,000,000', c.x, 78, '#ffe070', 18);
      addFloat('МИЛЛИОН!!!', c.x, 44, '#ffd040', 16);
      addFloat('★ БОСС ДОВОЛЕН ★', c.x, 22, '#fff8a0', 10);

      for(let i=0;i<120;i++){
        addP(rnd(0, W), rnd(-20, 40),
             rnd(-80,80), rnd(60, 180),
             rnd(1.5, 3.0), pick(['#ffe070','#ffd040','#ffffff','#ffb040','#ffa020','#ffe880']),
             Math.random()<0.4?2:1, 40);
      }
      for(let i=0;i<40;i++){
        const a = (i/40)*Math.PI*2;
        addP(c.x + Math.cos(a)*10, 120,
             Math.cos(a)*rnd(80,180), Math.sin(a)*rnd(60,150) - 60,
             rnd(1.2, 2.2), pick(['#ffe070','#ffd040','#ffffff']),
             Math.random()<0.4?2:1, 80);
      }
      for(let i=0;i<5;i++){
        setTimeout(()=>{
          state.flash = 0.6;
          state.flashCol = '#fff4a0';
        }, i*120);
      }
      state.shake = 1.6;
      bossJackpotSound();
      state.jackpots++;
    } else {
      const base = 8 + target.length * 5;
      const tip  = Math.round(c.patience * 14);
      const total = (base + tip) * mult;
      state.money += total;
      state.served++;
      addFloat('+'+fmtMoney(total), c.x, 62, '#ffe070', 10);
      if(mult > 1){
        addFloat('×'+mult+' КОМБО!', c.x, 50, '#ffb040', 9);
      } else {
        addFloat(tip > 8 ? 'ИДЕАЛЬНО!' : 'ОТЛИЧНО!', c.x, 50, '#8ce070', 9);
      }
      tone(880, 0.07, 'square', 0.038);
      tone(1174, 0.10, 'square', 0.038, 0.07);
      tone(1480, 0.09, 'square', 0.030, 0.15);
      for(let i=0;i<14;i++){
        addP(c.x + rnd(-14,14), rnd(60, 90), rnd(-40,40), rnd(-70,-20),
             rnd(0.5,1.0), pick(['#ffe070','#fff0a0','#8ce070','#ffffff']),
             Math.random()<0.4?2:1, 80);
      }
      // Tips
      const rollTip = Math.random();
      if(rollTip < 0.20){
        const jackpot = 10000;
        state.money += jackpot;
        state.totalTips += jackpot;
        state.jackpots++;
        addFloat('+'+fmtMoney(jackpot), c.x, 78, '#ffe070', 16);
        addFloat('ЧАЕВЫЕ!!!', c.x, 40, '#ffd040', 12);
        for(let i=0;i<50;i++){
          addP(rnd(20, W-20), rnd(30, H-40), rnd(-120,120), rnd(-180,-40),
               rnd(0.8,1.8), pick(['#ffe070','#ffd040','#ffffff','#ffb040','#ffa020']),
               Math.random()<0.4?2:1, 100);
        }
        jackpotSound();
        state.flash = 0.6;
        state.flashCol = '#fff4a0';
        state.shake = 0.9;
      } else {
        const smallTip = Math.floor(rnd(1, 7));
        state.money += smallTip;
        state.totalTips += smallTip;
        addFloat('+'+fmtMoney(smallTip)+' чай', c.x, 78, '#ffd070', 9);
      }
      state.flash = 0.35;
      state.flashCol = '#fff4c0';
    }
    c.state = 'out';
  } else {
    /* ═══════════════════════════════════════════
       НЕПРАВИЛЬНЫЙ НАПИТОК — ДЕНЕЖНЫЙ ШТРАФ
       Чердечки НЕ тратятся, только деньги!
       ═══════════════════════════════════════════ */
    state.combo = 0;
    c.mood = 'angry';

    if(c.boss){
      // БОСС в ярости — забирает $500,000!
      const loss = 500000;
      state.money -= loss;
      state.totalLost += loss;
      state.penalties++;
      state.bossLosses++;

      addFloat('-'+fmtMoney(loss), c.x, 78, '#ff4040', 18);
      addFloat('БОСС В ЯРОСТИ!', c.x, 44, '#ff8080', 12);
      addFloat('★ МИНУС ПОЛМИЛЛИОНА ★', c.x, 22, '#ff5050', 10);

      megaPenaltySound();
      state.shake = 2.0;
      state.flash = 0.7;
      state.flashCol = '#ff2020';

      // Красная волна частиц от босса
      for(let i=0;i<80;i++){
        addP(c.x + rnd(-30,30), rnd(60, 130),
             rnd(-150,150), rnd(-140,-20),
             rnd(0.8,1.8), pick(['#ff2020','#c01010','#8a0808','#ff6060']),
             Math.random()<0.5?2:1, 80);
      }
      // Взрыв снизу
      for(let i=0;i<30;i++){
        const a = (i/30)*Math.PI*2;
        addP(c.x + Math.cos(a)*15, 130,
             Math.cos(a)*rnd(100,220), Math.sin(a)*rnd(80,180) - 80,
             rnd(1.0, 1.8), '#ff3030', 2, 100);
      }
    } else {
      // Обычный гость — минус $50,000
      const loss = 50000;
      state.money -= loss;
      state.totalLost += loss;
      state.penalties++;

      addFloat('-'+fmtMoney(loss), c.x, 78, '#ff5050', 14);
      addFloat('НЕ ТО! -$50,000', c.x, 52, '#ff8080', 10);

      penaltySound();
      state.shake = 1.1;
      state.flash = 0.55;
      state.flashCol = '#ff3030';

      // Красные искры
      for(let i=0;i<25;i++){
        addP(c.x + rnd(-14,14), rnd(60, 100),
             rnd(-80,80), rnd(-100,-20),
             rnd(0.6,1.2), pick(['#ff3030','#c01010','#ff6060']),
             Math.random()<0.5?2:1, 80);
      }
    }

    // Всё равно показываем плевок — гость злится
    state.shake = Math.max(state.shake, 0.5);
    sipSound();
    for(let i=0;i<4;i++){
      addP(c.x + rnd(-10,10), 78, rnd(-15,15), rnd(-30,-10),
           rnd(0.4,0.7), pick(['#e05050','#a03030']), 1, 60);
    }
    c.state = 'sip';
    c.sipT = 0;

    // ⚠️ Чердечка НЕ тратится при неправильном напитке.
    // Только деньги.
  }
  state.cup = [];
}
function customerTimeout(){
  const c = state.customer;
  if(!c) return;
  state.combo = 0;
  // Чердечка тратится только когда гость УШЁЛ по таймауту
  state.lives--;
  c.mood = 'angry';
  c.state = 'curse';
  c.curse = { text: pick(CURSES), t: 1.6, max: 1.6 };
  c.bob = 0;
  addFloat(pick(CURSES), c.x, 58, '#ff4040', 14);
  addFloat('−1 ♥', c.x, 76, '#ff9090', 9);
  curseSound();
  noiseBurst(0.4, 0.03, 700);
  state.shake = 1.2;
  state.flash = 0.5;
  state.flashCol = '#e04040';
  for(let i=0;i<16;i++){
    addP(c.x + rnd(-14,14), rnd(50, 90), rnd(-50,50), rnd(-60,-10),
         rnd(0.5,1.0), pick(['#ff4040','#e02020','#a02020','#ff8080']), 1, 80);
  }
  if(state.lives <= 0) endGame();
}
function endGame(){
  state.phase = 'ending';
  state.endT = 1.8;
  // Рекорд считается только если баланс не отрицательный
  if(state.money > state.best && state.money > 0){
    state.best = state.money;
    saveBest(state.best);
  }
  tone(440, 0.35, 'sawtooth', 0.04);
  tone(330, 0.40, 'sawtooth', 0.035, 0.12);
  tone(196, 0.60, 'sawtooth', 0.03, 0.26);
  noiseBurst(0.5, 0.02, 500);
}
function startGame(){
  state.phase = 'play';
  state.money = 0;
  state.lives = 3;
  state.served = 0;
  state.combo = 0;
  state.bestCombo = 0;
  state.totalTips = 0;
  state.jackpots = 0;
  state.penalties = 0;
  state.totalLost = 0;
  state.specialsSeen = 0;
  state.bossesSeen = 0;
  state.bossWins = 0;
  state.bossLosses = 0;
  state.cup = [];
  state.customer = null;
  state.floats = [];
  state.spawnT = 0.8;
  state.lastRecipe = null;
  state.shake = 0;
  state.flash = 0;
  state.endT = 0;
  state.pour = null;
  state.pulse = 0;
  state.pressedBtn = -1;
  state.spitParts = [];
  state.splats = [];
  P.length = 0;
  tone(523, 0.08, 'square', 0.03);
  tone(659, 0.10, 'square', 0.03, 0.08);
  tone(784, 0.12, 'square', 0.03, 0.16);
  tone(1046, 0.14, 'square', 0.025, 0.24);
}

function update(dt){
  state.t += dt;
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt*3.2);
  if(state.flash > 0) state.flash = Math.max(0, state.flash - dt*2.2);
  if(state.pulse > 0) state.pulse = Math.max(0, state.pulse - dt*3.5);
  if(state.pour){
    state.pour.t -= dt;
    if(state.pour.t <= 0) state.pour = null;
  }
  updateSpitParts(dt);
  if(state.phase === 'ending'){
    state.endT -= dt;
    if(state.endT <= 0) state.phase = 'over';
  }
  if(state.phase === 'play' || state.phase === 'ending'){
    const c = state.customer;
    if(c){
      c.blink -= dt;
      if(c.blink <= -0.14) c.blink = 1.6 + Math.random()*3.5;
      if(c.curse){
        c.curse.t -= dt;
        if(c.curse.t <= 0){
          c.curse = null;
          c.state = 'out';
          c.bob = 0;
        }
      }
      if(c.state === 'in'){
        const d = c.targetX - c.x;
        c.x += d * Math.min(1, dt*6);
        c.bob += dt * 7;
        if(Math.abs(d) < 1.5){
          c.x = c.targetX;
          c.state = 'wait';
          c.bob = 0;
        }
      } else if(c.state === 'wait'){
        c.bob += dt * 2.8;
        if(state.phase === 'play'){
          c.patience -= dt / c.maxPatience;
          if(c.patience <= 0){
            c.patience = 0;
            customerTimeout();
          }
        }
      } else if(c.state === 'sip'){
        c.sipT += dt;
        c.bob += dt * 6;
        if(c.sipT > 0.4){
          c.state = 'spit';
          c.sipT = 0;
          spitSound();
        }
      } else if(c.state === 'spit'){
        c.sipT += dt;
        c.bob += dt * 8;
        if(Math.random() < 0.9) spawnSpitParticle(c);
        if(Math.random() < 0.55) spawnSpitParticle(c);
        if(Math.random() < 0.3)  spawnSpitParticle(c);
        state.shake = Math.max(state.shake, 0.5);
        if(c.sipT > 0.7){
          c.state = 'out';
          addFloat('ФУУУ!', c.x, 50, '#ff6060', 12);
          for(let i=0;i<6;i++){
            state.splats.push({
              x: rnd(30, W-30), y: rnd(30, H-50),
              r: rnd(4, 10), life: 2.8, max: 2.8,
              col: pick(['#4a2812','#3a1e0c','#5e3418']),
              seed: Math.random()
            });
          }
          state.flash = 0.4;
          state.flashCol = '#6e3c1a';
        }
      } else if(c.state === 'curse'){
        c.bob += dt * 10;
        state.shake = Math.max(state.shake, 0.35);
        if(Math.random() < 0.4){
          addP(c.x + rnd(-14,14), rnd(50, 90), rnd(-40,40), rnd(-50,-10),
               rnd(0.3,0.7), pick(['#ff4040','#e02020','#ff8080']), 1, 60);
        }
      } else if(c.state === 'out'){
        c.x += dt * 340;
        c.bob += dt * 8;
        if(c.x > W + 60){
          state.customer = null;
          state.spawnT = 0.5;
        }
      }
    } else if(state.phase === 'play'){
      state.spawnT -= dt;
      if(state.spawnT <= 0) spawnCustomer();
    }
  }
  for(const d of DUST){
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if(d.x < 110 || d.x > 330) d.vx *= -1;
    if(d.y < 55 || d.y > 130) d.vy *= -1;
  }
  for(let i=state.floats.length-1;i>=0;i--){
    const f = state.floats[i];
    f.y -= dt * 24;
    f.life -= dt;
    if(f.life <= 0) state.floats.splice(i,1);
  }
  updateP(dt);
}

function render(){
  ctx.save();
  if(state.shake > 0){
    ctx.translate(
      Math.round((Math.random()-0.5) * 5 * state.shake),
      Math.round((Math.random()-0.5) * 5 * state.shake)
    );
  }
  R(0, 0, W, H, '#0b0806');
  drawWall();
  drawMachine();
  if(state.customer) drawCustomer(state.customer);
  for(const d of DUST){
    const a = 0.15 + 0.3*(0.5 + 0.5*Math.sin(state.t*1.5 + d.ph));
    ctx.globalAlpha = clamp(a, 0, 1);
    R(d.x, d.y, 1, 1, '#ffe8b0');
    ctx.globalAlpha = 1;
  }
  drawCounter();
  drawWorkSurface();
  drawCup();
  drawCupStatus();
  drawButtons();
  drawServeButtons();
  if(state.customer && (state.customer.state === 'wait' || state.customer.state === 'in')){
    drawBubble(state.customer);
  }
  if(state.customer) drawCurseBubble(state.customer);
  drawP();
  drawFloats();
  drawHUD();
  drawSpitParts();
  drawSplats();
  if(state.phase === 'menu') drawMenu();
  if(state.phase === 'over') drawOver();
  ctx.restore();
  if(state.flash > 0){
    ctx.globalAlpha = state.flash * 0.35;
    ctx.fillStyle = state.flashCol;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 0.3;
  R(0, 0, W, 2, '#000000');
  R(0, H-2, W, 2, '#000000');
  R(0, 0, 2, H, '#000000');
  R(W-2, 0, 2, H, '#000000');
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function getPos(e){
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width  * W,
    y: (e.clientY - r.top ) / r.height * H
  };
}
cv.addEventListener('pointermove', e=>{
  const p = getPos(e);
  mouse.x = p.x; mouse.y = p.y;
});
cv.addEventListener('pointerleave', ()=>{
  mouse.x = -999; mouse.y = -999;
});
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  audio();
  const p = getPos(e);
  if(state.phase === 'menu' || state.phase === 'over'){ startGame(); return; }
  if(state.phase === 'ending') return;
  for(let i=0;i<ORDER.length;i++){
    if(inRect(p, BTN_X(i), BTN_Y, BTN_W, BTN_H)){
      state.pressedBtn = i;
      addIngredient(ORDER[i]);
      return;
    }
  }
  if(inRect(p, SRV_X, SRV_Y, SRV_W, SRV_H)){ serve(); return; }
  if(inRect(p, SRV_X, CLR_Y, SRV_W, CLR_H)){ clearCup(); return; }
});
cv.addEventListener('pointerup', ()=>{ state.pressedBtn = -1; });
window.addEventListener('keydown', e=>{
  if(state.phase === 'menu' || state.phase === 'over'){
    if(e.key === ' ' || e.key === 'Enter'){ startGame(); e.preventDefault(); }
    return;
  }
  if(state.phase !== 'play') return;
  const num = parseInt(e.key, 10);
  if(num >= 1 && num <= 5){
    state.pressedBtn = num-1;
    addIngredient(ORDER[num-1]);
    e.preventDefault();
    return;
  }
  if(e.key === 'Enter'){ serve(); e.preventDefault(); return; }
  if(e.key === 'Backspace' || e.key === 'Escape'){ clearCup(); e.preventDefault(); }
});
window.addEventListener('keyup', ()=>{ state.pressedBtn = -1; });

requestAnimationFrame(loop);

})();
